[pytest]
# Put the app's source folders on the import path, so tests can simply
# `import brain`, `import weather`, `import factory`, etc. — no sys.path hacks.
pythonpath = backend simulation

# Only collect the new pytest suite here. The old standalone runners
# (backend/test_*.py, simulation/test_*.py) execute on import, so we keep
# them out of collection and migrate them into tests/ over T1.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q
