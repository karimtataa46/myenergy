name: tests

# Run the whole test suite automatically on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"       # matches the production Dockerfile
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browser (for the E2E tests)
        run: python -m playwright install --with-deps chromium

      - name: Run pytest with coverage
        run: |
          pytest --cov=backend --cov=simulation \
                 --cov-report=term-missing --cov-fail-under=40

      - name: Validate the simulation engine + optimiser (standalone proofs)
        run: |
          cd simulation
          python verify_simulation.py
          python test_decisions.py
